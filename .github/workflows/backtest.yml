name: Backtest

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 3 * * 0"   # elke zondagnacht nieuwe historie en opnieuw testen

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installeren
        run: pip install -r requirements.txt

      - name: Backtest en optimalisatie
        run: python backtest.py

      - name: Resultaten opslaan
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add data/history data/backtest.json data/tuned_params.json data/backtest_log.txt docs/backtest.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Niets nieuws"; exit 0; fi
          git commit -m "Backtest update [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
