name: Trader

on:
  schedule:
    - cron: "3,18,33,48 * * * *"   # vangnet: start de keten opnieuw als die ooit uitvalt
  workflow_dispatch: {}

permissions:
  contents: write   # resultaten opslaan
  actions: write    # de volgende run starten

concurrency:
  group: trader     # nooit twee runs tegelijk: voorkomt dubbele orders
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installeren
        run: pip install -r requirements.txt

      - name: Bot aan het werk (elk kwartier, bijna 6 uur lang)
        env:
          KRAKEN_API_KEY: ${{ secrets.KRAKEN_API_KEY }}
          KRAKEN_API_SECRET: ${{ secrets.KRAKEN_API_SECRET }}
          LOOP_MINUTES: "340"
        run: python loop.py

      - name: Volgende run starten
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run trading-bot.yml --ref main
