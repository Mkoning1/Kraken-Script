name: Engine Safety CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q agents main.py loop.py backtest.py scripts tests
      - name: Risk and execution regressions
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Existing Kraken mock safety scenarios
        run: python -m tests.quick
      - name: Read-only health report
        run: python scripts/audit_engine.py --json
