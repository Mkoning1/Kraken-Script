<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Opportunities · Kraken Agents</title>
<style>
:root{--bg:#0e0a27;--card:#17113d;--card2:#211850;--edge:#3b3174;--text:#f4f1ff;--muted:#aaa4c8;--good:#5cf2b3;--bad:#ff6b78;--warn:#ffb547;--cyan:#45d1ee;--violet:#b9aeff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#24165d 0,#0e0a27 43%);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:18px;padding:13px 20px;background:#120d32eF;border-bottom:1px solid var(--edge);backdrop-filter:blur(14px)}
.brand{font-weight:800;letter-spacing:.03em}.tabs{display:flex;gap:8px}.tabs a{color:var(--muted);text-decoration:none;padding:7px 10px;border-radius:7px}.tabs a[aria-current=page],.tabs a:hover{background:#2d2269;color:#fff}
main{max-width:1400px;margin:auto;padding:24px}.hero{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}.hero h1{font-size:clamp(1.7rem,4vw,3rem);margin:0}.hero p{max-width:760px;color:var(--muted);margin:.4rem 0 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi,.card{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--edge);border-radius:14px;padding:16px}.kpi small{color:var(--muted);display:block}.kpi b{font-size:1.55rem}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.muted{color:var(--muted)}
section{margin:26px 0}h2{margin:0 0 10px;font-size:1.18rem}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
.table{overflow:auto;border:1px solid var(--edge);border-radius:12px}table{width:100%;border-collapse:collapse;background:#151037}th,td{padding:10px 11px;text-align:left;border-bottom:1px solid #2e2760;white-space:nowrap}th{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:0}
.score{display:inline-flex;min-width:48px;justify-content:center;border-radius:999px;padding:3px 8px;background:#302769;font-weight:700}.asset{font-weight:750}.chip{display:inline-block;padding:3px 7px;border:1px solid var(--edge);border-radius:999px;color:var(--muted);font-size:.75rem}.crypto{border-color:#2d8da4;color:#70ddf4}.equity{border-color:#7d70c8;color:#c7bfff}
.bar{height:7px;background:#332b64;border-radius:999px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--good))}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.candidate h3{margin:0;font-size:1rem}.candidate .price{font-size:1.25rem;font-weight:750;margin:.35rem 0}.components{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:.78rem;color:var(--muted)}
.notice{border-left:4px solid var(--warn);background:#241a49;padding:12px 14px;border-radius:8px}.empty{color:var(--muted);padding:20px;text-align:center}
footer{margin:38px 0;color:var(--muted);font-size:.82rem}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.split,.cards{grid-template-columns:1fr}header{flex-wrap:wrap}.hero{display:block}}
@media(max-width:520px){.grid{grid-template-columns:1fr}main{padding:16px}}
</style>
</head>
<body>
<header>
  <span class="brand">Kraken agents</span>
  <nav class="tabs">
    <a href="index.html">Handelsvloer</a>
    <a href="trades.html">Trades</a>
    <a href="details.html">Details</a>
    <a href="opportunities.html" aria-current="page">Opportunities</a>
  </nav>
</header>
<main id="app"><div class="empty">Opportunity desks laden…</div></main>
<script>
const eur=new Intl.NumberFormat("nl-NL",{style:"currency",currency:"EUR"});
const hkd=new Intl.NumberFormat("nl-NL",{style:"currency",currency:"HKD"});
const num=(v,d=1)=>v==null?"–":new Intl.NumberFormat("nl-NL",{minimumFractionDigits:d,maximumFractionDigits:d}).format(v);
const pct=v=>v==null?"–":(v>0?"+":"")+num(v,1)+"%";
const cls=v=>v>0?"good":v<0?"bad":"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when=ts=>ts?new Date(ts*1000).toLocaleString("nl-NL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"nog niet";
const comp=(c,k)=>c?.[k]==null?"–":num(c[k],0);

function combinedBoard(c,e){
  if(e?.opportunity_board?.length)return e.opportunity_board;
  const out=[];
  for(const x of c?.scanner?.candidates||[])out.push({asset_class:"crypto",symbol:x.market,name:x.market.split("/")[0],score:(x.score||0)*100,momentum_pct:x.change_pct,mode:x.selected?"shadow":"radar",reason:"Kraken opportunity scanner"});
  for(const x of e?.candidates||[])out.push({asset_class:"equity",symbol:x.symbol,name:x.name,score:x.score,momentum_pct:x.m20_pct,mode:"paper",reason:x.theme});
  return out.sort((a,b)=>b.score-a.score).slice(0,12);
}
function boardTable(board){
  if(!board.length)return '<div class="empty">Nog geen cross-market scores beschikbaar.</div>';
  return '<div class="table"><table><thead><tr><th>#</th><th>Asset</th><th>Klasse</th><th>Score</th><th>Momentum</th><th>Modus</th><th>Waarom</th></tr></thead><tbody>'+
    board.map((x,i)=>'<tr><td>'+(i+1)+'</td><td class="asset">'+esc(x.name)+'<br><small class="muted">'+esc(x.symbol)+'</small></td><td><span class="chip '+esc(x.asset_class)+'">'+esc(x.asset_class)+'</span></td><td><span class="score">'+num(x.score,0)+'</span></td><td class="'+cls(x.momentum_pct)+'">'+pct(x.momentum_pct)+'</td><td>'+esc(x.mode)+'</td><td class="muted">'+esc(x.reason)+'</td></tr>').join("")+
    '</tbody></table></div>';
}
function equityCards(e){
  const rows=(e?.candidates||[]).slice(0,6);
  if(!rows.length)return '<div class="empty">De eerste China/HK-scan moet nog draaien.</div>';
  return '<div class="cards">'+rows.map(x=>'<article class="card candidate"><h3>'+esc(x.name)+'</h3><span class="chip">'+esc(x.symbol)+'</span><div class="price">'+hkd.format(x.price)+'</div><p class="muted">'+esc(x.theme||"")+'</p><p><span class="score">'+num(x.score,0)+'/100</span> <span class="'+cls(x.m20_pct)+'">20d '+pct(x.m20_pct)+'</span></p><div class="components"><span>Groei <b>'+comp(x.components,"growth")+'</b></span><span>Marges <b>'+comp(x.components,"margin")+'</b></span><span>Momentum <b>'+comp(x.components,"momentum")+'</b></span><span>Waardering <b>'+comp(x.components,"valuation")+'</b></span><span>Kwaliteit <b>'+comp(x.components,"quality")+'</b></span><span>Datadekking <b>'+num(x.data_quality_pct,0)+'%</b></span></div></article>').join("")+'</div>';
}
function paperTable(e){
  const p=e?.paper||{}, pos=p.positions||[];
  return '<div class="card"><h2>China/HK paper portfolio</h2><p><b>'+hkd.format(p.equity||0)+'</b> <span class="'+cls(p.return_pct)+'">'+pct(p.return_pct)+'</span></p><p class="muted">Vrij '+hkd.format(p.cash||0)+' · '+pos.length+' open · '+(p.trade_count||0)+' afgesloten trades'+(p.win_rate_pct!=null?' · '+num(p.win_rate_pct,0)+'% winrate':'')+'</p>'+(pos.length?'<div class="table"><table><thead><tr><th>Positie</th><th>Waarde</th><th>P/L</th><th>Score</th></tr></thead><tbody>'+pos.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+hkd.format(x.value)+'</td><td class="'+cls(x.unrealized)+'">'+hkd.format(x.unrealized)+'</td><td>'+num(x.score,0)+'</td></tr>').join("")+'</tbody></table></div>':'<p class="empty">Nog geen paperposities.</p>')+'</div>';
}
function cryptoTable(c){
 const rows=(c?.scanner?.candidates||[]).slice(0,10);
 if(!rows.length)return '<div class="card empty">Geen crypto-radardata.</div>';
 return '<div class="table"><table><thead><tr><th>Munt</th><th>Score</th><th>24u</th><th>Range</th><th>Volume</th><th>Status</th></tr></thead><tbody>'+rows.map(x=>'<tr><td class="asset">'+esc(x.market)+'</td><td><span class="score">'+num((x.score||0)*100,0)+'</span></td><td class="'+cls(x.change_pct)+'">'+pct(x.change_pct)+'</td><td>'+pct(x.range_pct)+'</td><td>'+eur.format(x.quote_volume||0)+'</td><td>'+(x.selected?'<span class="chip crypto">discovery · schaduw</span>':'radar')+'</td></tr>').join("")+'</tbody></table></div>';
}
async function load(){
 try{
   const [cr,er]=await Promise.all([fetch("data.json?t="+Date.now(),{cache:"no-store"}),fetch("equities.json?t="+Date.now(),{cache:"no-store"})]);
   if(!cr.ok)throw new Error("crypto "+cr.status);
   const c=await cr.json(),e=er.ok?await er.json():null,board=combinedBoard(c,e);
   const top=board[0],paper=e?.paper||{};
   document.getElementById("app").innerHTML=
   '<div class="hero"><div><h1>Global Opportunity Engine</h1><p>Crypto en China/Hongkong naast elkaar. De scores zijn een research-rangschikking, geen garantie: crypto discovery blijft schaduw en aandelen blijven paper-only tot een brokerverbinding afzonderlijk is gevalideerd.</p></div><span class="muted">Crypto '+when(c.generated_ts)+' · China/HK '+when(e?.generated_ts)+'</span></div>'+
   '<div class="grid"><div class="kpi"><small>Beste radar-kans</small><b>'+(top?esc(top.name):"–")+'</b><div class="muted">'+(top?num(top.score,0)+"/100 · "+esc(top.asset_class):"")+'</div></div><div class="kpi"><small>Crypto discovery</small><b>'+((c.scanner?.active_discovery_markets||[]).length)+'</b><div class="muted">schaduw-only</div></div><div class="kpi"><small>China/HK geladen</small><b>'+((e?.candidates||[]).length)+'</b><div class="muted">fundamentals + momentum</div></div><div class="kpi"><small>Equity paper</small><b class="'+cls(paper.return_pct)+'">'+pct(paper.return_pct||0)+'</b><div class="muted">'+hkd.format(paper.equity||paper.start||0)+'</div></div></div>'+
   (e?.error?'<p class="notice"><b>Equity datasource melding:</b> '+esc(e.error)+'</p>':'')+
   '<section><h2>Cross-market ranglijst</h2>'+boardTable(board)+'</section>'+
   '<section><h2>China/Hongkong · hoogste scores</h2>'+equityCards(e)+'</section>'+
   '<section class="split">'+paperTable(e)+'<div class="card"><h2>Live aandelenstatus</h2><p><b>'+esc(e?.broker?.provider||"Interactive Brokers")+'</b></p><p class="warn">Live execution staat uit.</p><p class="muted">'+esc(e?.broker?.reason||"Eerst brokerverbinding en permissies valideren.")+'</p><p>De research- en paperlaag kan dus al zelfstandig bewijs verzamelen zonder dat een aandeel wordt gekocht.</p></div></section>'+
   '<section><h2>Crypto opportunity radar</h2>'+cryptoTable(c)+'</section>'+
   '<footer>Opportunity-scores combineren verschillende modellen en zijn bedoeld voor rangschikking en paper-validatie. Transactiekosten en slippage worden in de paperportfolio meegenomen.</footer>';
 }catch(err){document.getElementById("app").innerHTML='<div class="empty">Dashboarddata kon niet worden geladen: '+esc(err.message)+'</div>'}
}
load();setInterval(load,60000);
</script>
</body>
</html>
