<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trades & posities · Kraken agents</title>
<style>
:root{--bg:#0f0928;--panel:#17113d;--panel2:#211850;--edge:#3b3174;--text:#f4f1ff;--muted:#aaa4c8;--good:#5cf2b3;--bad:#ff6b78;--money:#ffb547;--accent:#8f7bff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 65% 0,#261760 0,#0f0928 44%);color:var(--text);font:15px/1.45 Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:18px;padding:13px 20px;background:#120d32ef;border-bottom:1px solid var(--edge);backdrop-filter:blur(14px)}
.brand{font-weight:800}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs a{color:var(--muted);text-decoration:none;padding:7px 10px;border-radius:7px}.tabs a[aria-current=page],.tabs a:hover{background:#2d2269;color:#fff}
main{max-width:1400px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:18px}.hero h1{font-size:clamp(1.8rem,4vw,3rem);margin:0}.hero p{max-width:760px;color:var(--muted);margin:.4rem 0 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.kpi{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--edge);border-radius:14px;padding:16px}.kpi small{display:block;color:var(--muted)}.kpi b{font-size:1.5rem}.good{color:var(--good)}.bad{color:var(--bad)}.money{color:var(--money)}.muted{color:var(--muted)}
section{margin:28px 0}h2{font-size:1.18rem;margin:0 0 10px}.positions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.position h3{margin:0;font-size:1.05rem}.position .big{font-size:1.4rem;font-weight:800;margin:.35rem 0}.line{display:flex;justify-content:space-between;gap:14px;padding:4px 0;border-top:1px solid #31295f}.line span:first-child{color:var(--muted)}.chip{display:inline-block;padding:3px 7px;border:1px solid var(--edge);border-radius:999px;color:var(--muted);font-size:.75rem}.chip.live{border-color:var(--money);color:var(--money)}.chip.ok{border-color:var(--good);color:var(--good)}
.table{overflow:auto;border:1px solid var(--edge);border-radius:12px;background:#151037}table{width:100%;border-collapse:collapse}th,td{padding:10px 11px;text-align:left;border-bottom:1px solid #2e2760;white-space:nowrap}th{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:0}
details{border:1px solid var(--edge);border-radius:12px;background:#151037;padding:0 14px}summary{cursor:pointer;padding:12px 0;font-weight:700}details .inside{padding-bottom:14px}.scan-on{color:var(--good);font-weight:700}.scan-off{color:#625b84}.empty{padding:22px;color:var(--muted);text-align:center}.note{border-left:4px solid var(--money);background:#241a49;padding:12px 14px;border-radius:8px}.scanrow b{font-weight:700}.legend{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}.positions{grid-template-columns:1fr}.hero{display:block}}
@media(max-width:520px){.grid{grid-template-columns:1fr}main{padding:16px}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header>
  <span class="brand">Kraken agents</span>
  <nav class="tabs">
    <a href="index.html">Handelsvloer</a>
    <a href="trades.html" aria-current="page">Trades</a>
    <a href="details.html">Details</a>
    <a href="opportunities.html">Opportunities</a>
  </nav>
</header>
<main id="app"><div class="empty">Trades en scanlog laden…</div></main>
<script>
const eur=new Intl.NumberFormat("nl-NL",{style:"currency",currency:"EUR"});
const num=(v,d=2)=>v==null?"–":new Intl.NumberFormat("nl-NL",{minimumFractionDigits:d,maximumFractionDigits:d}).format(v);
const pct=v=>v==null?"–":(v>0?"+":"")+num(v,1)+"%";
const cls=v=>v>0?"good":v<0?"bad":"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when=ts=>ts?new Date(ts*1000).toLocaleString("nl-NL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"–";
const base=m=>String(m||"").split("/")[0];
const simpleAgent=a=>({"trend4h":"Trend 4u","mean_reversion":"Dip-koper","breakout":"Swing breakout","momentum":"Momentum 15m","squeeze":"Squeeze 15m","fast_breakout":"Snelle breakout 15m"}[a]||a||"onbekend");

function positionsHTML(live){
 const ps=live?.positions||[];
 if(!ps.length)return '<div class="empty">Op dit moment houdt de bot geen positie met echt geld vast.</div>';
 return '<div class="positions">'+ps.map(p=>{
   const plan=p.plan||{}, pnlp=p.entry_cost?((p.value/p.entry_cost)-1)*100:null;
   return '<article class="card position"><div><span class="chip live">ECHT GELD</span> <span class="chip">'+esc(simpleAgent(p.agent))+'</span></div>'+
   '<h3>'+esc(p.market)+'</h3><div class="big">'+eur.format(p.value||0)+'</div>'+
   '<div class="line"><span>Resultaat nu</span><b class="'+cls(p.unrealized)+'">'+eur.format(p.unrealized||0)+' · '+pct(pnlp)+'</b></div>'+
   '<div class="line"><span>Gekocht rond</span><b>'+eur.format(p.entry_price||0)+'</b></div>'+
   '<div class="line"><span>Koers nu</span><b>'+eur.format(p.price||0)+'</b></div>'+
   '<div class="line"><span>Stop</span><b>'+eur.format(p.stop||0)+'</b></div>'+
   '<div class="line"><span>Bescherming</span><b class="'+(p.stop_on_exchange?'good':'bad')+'">'+(p.stop_on_exchange?'Stop staat op Kraken':'Stop nog niet bevestigd')+'</b></div>'+
   '<div class="line"><span>Desk</span><b>'+esc(plan.desk||simpleAgent(p.agent))+(plan.timeframe_minutes?' · '+plan.timeframe_minutes+'m':'')+'</b></div>'+
   '<p class="muted" style="margin-bottom:0">'+esc(p.entry_reason||"")+'</p></article>';
 }).join("")+'</div>';
}
function closedTradesHTML(d){
 const live=d.books?.live?.trades||[];
 const legacy=(d.legacy_trades||[]).map(t=>({market:t.symbol,entry_price:t.entry_price,exit_price:t.exit_price,pnl:null,pnl_pct:t.pnl_pct,exit_ts:t.exit_time?Date.parse(t.exit_time)/1000:null,agent:"oude bot",exit_reason:"Historische trade uit de eerdere Kraken-bot"}));
 const rows=[...live,...legacy].sort((a,b)=>(b.exit_ts||0)-(a.exit_ts||0));
 if(!rows.length)return '<div class="empty">Nog geen afgesloten trades.</div>';
 return '<div class="table"><table><thead><tr><th>Wanneer</th><th>Munt</th><th>Door</th><th>In</th><th>Uit</th><th>Resultaat</th><th>Waarom eruit</th></tr></thead><tbody>'+
 rows.map(t=>'<tr><td>'+when(t.exit_ts)+'</td><td><b>'+esc(t.market)+'</b></td><td>'+esc(simpleAgent(t.agent))+'</td><td>'+eur.format(t.entry_price||0)+'</td><td>'+eur.format(t.exit_price||0)+'</td><td class="'+cls(t.pnl_pct)+'"><b>'+pct(t.pnl_pct)+'</b>'+(t.pnl!=null?' · '+eur.format(t.pnl):'')+'</td><td class="muted">'+esc(t.exit_reason||"–")+'</td></tr>').join("")+
 '</tbody></table></div>';
}
function shadowHTML(d){
 const b=d.books?.schaduw;
 if(!b)return "";
 const ps=b.positions||[], tr=b.trades||[];
 return '<details><summary>Testafdeling · schaduwgeld ('+ps.length+' open, '+tr.length+' afgesloten)</summary><div class="inside">'+
   '<p class="muted">Dit is nepgeld. Deze trades worden gebruikt om nieuwe strategieën te bewijzen voordat ze echt geld mogen gebruiken.</p>'+
   (ps.length?'<div class="table"><table><thead><tr><th>Munt</th><th>Strategie</th><th>Waarde</th><th>Resultaat nu</th></tr></thead><tbody>'+ps.map(p=>'<tr><td>'+esc(p.market)+'</td><td>'+esc(simpleAgent(p.agent))+'</td><td>'+eur.format(p.value||0)+'</td><td class="'+cls(p.unrealized)+'">'+eur.format(p.unrealized||0)+'</td></tr>').join("")+'</tbody></table></div>':'<p class="empty">Geen open schaduwposities.</p>')+
   '</div></details>';
}
function scanHTML(d){
 const rows=d.scan_history||[];
 if(!rows.length)return '<div class="empty">Het nieuwe scanlog begint bij de eerstvolgende botrun.</div>';
 const dayAgo=Date.now()/1000-86400, recent=rows.filter(x=>x.ts>=dayAgo);
 const deskCount=k=>recent.filter(x=>x.desks?.[k]).length;
 const body=rows.map(x=>{
   const top=x.top?.[0];
   const acts=x.actions||{};
   return '<tr class="scanrow"><td>'+when(x.ts)+'</td><td class="'+(x.ok?'good':'bad')+'">'+(x.ok?'OK':'Melding')+'</td>'+
   '<td><span class="scan-on">5m</span></td><td class="'+(x.desks?.discovery?'scan-on':'scan-off')+'">'+(x.desks?.discovery?'15m':'–')+'</td>'+
   '<td class="'+(x.desks?.fast?'scan-on':'scan-off')+'">'+(x.desks?.fast?'JA':'–')+'</td><td class="'+(x.desks?.swing?'scan-on':'scan-off')+'">'+(x.desks?.swing?'JA':'–')+'</td><td class="'+(x.desks?.trend?'scan-on':'scan-off')+'">'+(x.desks?.trend?'JA':'–')+'</td>'+
   '<td>'+x.eligible+' gezien · '+x.ranked+' gerankt · '+x.active+' actief</td>'+
   '<td>'+(top?'<b>'+esc(top.market)+'</b> '+num(top.score,0)+'/100':'–')+'</td>'+
   '<td>'+(acts.buy||0)+' koop · '+(acts.sell||0)+' verkoop · '+(acts.blocked||0)+' geblokkeerd</td></tr>';
 }).join("");
 return '<div class="grid" style="margin-bottom:12px"><div class="kpi"><small>Scans laatste 24u</small><b>'+recent.length+'</b></div><div class="kpi"><small>Fast desk gedraaid</small><b>'+deskCount("fast")+'×</b></div><div class="kpi"><small>Swing desk gedraaid</small><b>'+deskCount("swing")+'×</b></div><div class="kpi"><small>Trend desk gedraaid</small><b>'+deskCount("trend")+'×</b></div></div>'+
 '<div class="legend"><span><b class="scan-on">5m</b> = iedere controle</span><span><b class="scan-on">15m</b> = discovery ververst</span><span>Fast / Swing / Trend = die desk heeft echt nieuwe candles beoordeeld</span></div>'+
 '<div class="table"><table><thead><tr><th>Tijd</th><th>Status</th><th>Monitor</th><th>Discovery</th><th>Fast</th><th>Swing</th><th>Trend</th><th>Markten</th><th>Beste radar</th><th>Actie</th></tr></thead><tbody>'+body+'</tbody></table></div>';
}
async function load(){
 try{
  const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"}); if(!r.ok)throw new Error(r.status);
  const d=await r.json(), live=d.books?.live, st=live?.stats||{}, all=String(d.budget_eur).toLowerCase()==="alles";
  document.getElementById("app").innerHTML=
   '<div class="hero"><div><h1>Trades & posities</h1><p>Hier staat alleen wat je als leek echt wilt weten: wat de bot nu met echt geld vasthoudt, wat hij al verkocht heeft, en wat iedere scan heeft gecontroleerd.</p></div><span class="muted">Laatste botrun '+when(d.generated_ts)+'</span></div>'+
   '<div class="grid"><div class="kpi"><small>Kraken-vermogen in bot</small><b class="money">'+eur.format(st.equity||0)+'</b></div><div class="kpi"><small>Vrij om te gebruiken</small><b>'+eur.format(live?.cash||0)+'</b></div><div class="kpi"><small>Nu belegd</small><b>'+eur.format(live?.exposure||0)+'</b></div><div class="kpi"><small>Budgetregel</small><b>'+(all?'ALLES':'VAST')+'</b><div class="muted">'+(all?'Heel je vrije EUR-saldo op Kraken mag worden ingezet':'Vast budget ingesteld')+'</div></div></div>'+
   (all?'<p class="note"><b>Budget:</b> ja — de live bot mag je volledige vrije EUR-saldo op Kraken gebruiken. De risico-agent bepaalt nog steeds hoeveel er per trade daadwerkelijk ingezet wordt.</p>':'')+
   '<section><h2>Wat houdt hij nu vast?</h2>'+positionsHTML(live)+'</section>'+
   '<section><h2>Alle afgesloten trades met echt geld</h2>'+closedTradesHTML(d)+'</section>'+
   '<section><h2>Schaduwtests</h2>'+shadowHTML(d)+'</section>'+
   '<section id="scanlog"><h2>Scanlog · iedere controle</h2><p class="muted">Dit log begint vanaf deze dashboardupgrade en bewaart de laatste zeven dagen aan scans.</p>'+scanHTML(d)+'</section>';
 }catch(e){document.getElementById("app").innerHTML='<div class="empty">Data kon niet worden geladen: '+esc(e.message)+'</div>'}
}
load();setInterval(load,60000);
</script>
</body>
</html>
