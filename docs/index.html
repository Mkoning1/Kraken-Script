<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kraken agents: handelsvloer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --void: #140D33;
  --glass: rgba(24, 16, 62, 0.86);
  --edge: rgba(190, 170, 255, 0.28);
  --text: #EEEAFF;
  --muted: #A9A0D6;
  --buy: #5CF2B3;
  --neg: #FF6B78;
  --money: #FFB547;
  --accent: #8F7BFF;
  --sans: "Saira", system-ui, -apple-system, "Segoe UI", sans-serif;
  --cond: "Saira Condensed", "Saira", system-ui, sans-serif;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--void); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; }
body.floor { height: 100vh; overflow: hidden; }
a { color: #C9BDFF; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--money); outline-offset: 2px; }
.up { color: var(--buy); } .down { color: var(--neg); }

/* Bovenbalk */
.bar { position: relative; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 26px; padding: 10px 20px; background: rgba(16, 10, 44, 0.92); border-bottom: 1px solid var(--edge); padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
.brand { font-family: var(--cond); font-weight: 700; font-size: 1.3rem; letter-spacing: .02em; }
.tabs { display: flex; gap: 4px; margin-right: auto; }
.tabs a { text-decoration: none; color: var(--muted); padding: 4px 12px; border-radius: 3px; font-weight: 500; }
.tabs a[aria-current="page"] { color: var(--text); background: rgba(143, 123, 255, 0.25); }
.mode { font-family: var(--cond); font-weight: 600; padding: 2px 12px; border: 1px solid currentColor; border-radius: 3px; }
.mode.live { color: var(--money); }
.mode.other { color: #C9BDFF; }
.kpi { display: flex; flex-direction: column; line-height: 1.12; }
.kpi span { font-size: .75rem; color: var(--muted); }
.kpi b { font-family: var(--cond); font-weight: 600; font-size: 1.2rem; }
.kpi .money { color: var(--money); }

/* 3D-vloer */
#stage { position: fixed; inset: 0; top: 0; z-index: 1; }
#stage canvas { display: block; }
.l2d { pointer-events: none; }
.desk-tag { pointer-events: auto; cursor: pointer; font-family: var(--cond); font-weight: 600; font-size: 13px; color: #fff; background: rgba(30, 20, 78, 0.88); border: 1px solid rgba(200, 185, 255, 0.55); padding: 2px 7px; border-radius: 3px; white-space: nowrap; transform: translateY(-4px); }
.desk-tag small { font-family: var(--sans); font-weight: 400; color: var(--muted); margin-left: 5px; }
.desk-tag .pos { color: var(--money); margin-left: 5px; }
.desk-tag .pos.sh { color: #C9BDFF; }
.desk-tag.ping { animation: ping .9s ease-out; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(92, 242, 179, .9); border-color: var(--buy); } 100% { box-shadow: 0 0 0 14px rgba(92, 242, 179, 0); } }
.room-tag { pointer-events: auto; cursor: pointer; font-family: var(--cond); font-weight: 600; font-size: 14px; color: #fff; padding: 2px 9px; border-radius: 2px; white-space: nowrap; }
.bubble { pointer-events: none; max-width: 210px; font-size: 12px; line-height: 1.3; color: #1A1240; background: #fff; padding: 5px 9px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0, 0, 0, .35); transition: transform .25s, opacity .25s; transform: translateY(-6px); }
.bubble.hot { background: #FFF4DE; box-shadow: 0 0 0 2px var(--money), 0 4px 16px rgba(255, 181, 71, .45); }
.bubble.quiet { opacity: 0; transform: translateY(4px); }
.mini { pointer-events: none; font-family: var(--cond); font-weight: 700; font-size: 12px; padding: 1px 6px; border-radius: 8px; color: #10122A; }
.gate-tag { pointer-events: none; font-family: var(--cond); font-weight: 700; font-size: 15px; color: var(--money); text-shadow: 0 0 10px rgba(255, 181, 71, .7); }

/* Panelen over de vloer */
.panel { position: fixed; z-index: 4; right: 14px; top: 76px; bottom: 14px; width: 370px; overflow-y: auto; background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(8px); padding: 16px 18px; border-radius: 4px; }
.panel h2 { font-family: var(--cond); font-weight: 600; font-size: 1.1rem; margin: 0 0 8px; color: #C9BDFF; }
.panel h3 { font-family: var(--cond); font-weight: 600; font-size: 1.5rem; margin: 0; line-height: 1.15; }
.panel .sub { color: var(--muted); font-size: .88rem; margin: 2px 0 12px; }
.panel .close { position: absolute; top: 8px; right: 10px; border: 0; background: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; line-height: 1; }
.panel .back { border: 0; background: none; color: #C9BDFF; cursor: pointer; padding: 0; margin: 0 0 10px; font-size: .85rem; }
.panel section { margin: 0 0 16px; }
.panel p { margin: 0 0 6px; font-size: .9rem; }
.doing { padding: 10px 12px; border-left: 3px solid var(--accent); background: rgba(143, 123, 255, 0.12); margin-bottom: 14px; }
.doing .act { font-family: var(--cond); font-size: 1.35rem; font-weight: 600; }
.act-buy { color: var(--buy); } .act-sell { color: var(--neg); } .act-hold { color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 14px; font-size: .88rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 6px 0; border-top: 1px solid rgba(190, 170, 255, 0.14); font-size: .86rem; }
.list li button.link { border: 0; background: none; color: #C9BDFF; cursor: pointer; padding: 0; font-weight: 600; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.chip { font-size: .72rem; padding: 0 6px; border: 1px solid var(--muted); color: var(--muted); border-radius: 2px; margin-left: 6px; vertical-align: 2px; white-space: nowrap; }
.chip.real { border-color: var(--money); color: var(--money); }
.story p { font-size: .88rem; }
.story p.cursor::after { content: "▍"; color: var(--money); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.when { color: var(--muted); font-size: .76rem; }
.err { color: var(--neg); }

.caption { position: fixed; z-index: 4; left: 14px; bottom: 14px; right: 400px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; pointer-events: none; }
.caption .now { background: var(--glass); border: 1px solid var(--edge); padding: 8px 14px; border-radius: 4px; font-family: var(--cond); font-size: 1.15rem; font-weight: 500; backdrop-filter: blur(8px); }
.caption .now b { color: var(--money); font-weight: 600; margin-right: 8px; }
.legend { position: fixed; z-index: 4; left: 14px; top: 76px; background: var(--glass); border: 1px solid var(--edge); padding: 10px 12px; border-radius: 4px; font-size: .8rem; backdrop-filter: blur(8px); }
.legend p { margin: 0 0 4px; color: var(--muted); }
.legend div { margin: 2px 0; }
.legend .sw { display: inline-block; width: 18px; height: 10px; margin-right: 6px; vertical-align: 0; border-radius: 2px; }
.tools { position: fixed; z-index: 4; left: 14px; bottom: 70px; display: flex; gap: 6px; }
.tools button { background: var(--glass); color: var(--text); border: 1px solid var(--edge); padding: 5px 12px; border-radius: 3px; cursor: pointer; }
.tools span { font-size: .78rem; color: var(--muted); align-self: center; }
.loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 3; color: var(--muted); font-family: var(--cond); font-size: 1.2rem; }

/* Compacte versie (telefoon) */
#compact { padding: 14px 16px 40px; }
#compact h2 { font-family: var(--cond); font-weight: 600; font-size: 1.1rem; color: #C9BDFF; margin: 18px 0 8px; }
.rooms-c { display: grid; gap: 8px; }
.rooms-c button { text-align: left; background: rgba(143, 123, 255, 0.10); border: 1px solid var(--edge); color: var(--text); padding: 8px 10px; border-radius: 4px; cursor: pointer; }
.rooms-c b { font-family: var(--cond); font-weight: 600; }
.rooms-c span { display: block; font-size: .8rem; color: var(--muted); }
.rooms-c span.dot { display: inline-block; }
.desks-c { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.desks-c button { background: rgba(255, 255, 255, 0.06); border: 1px solid var(--edge); color: var(--text); border-radius: 4px; padding: 8px; text-align: left; cursor: pointer; }
.desks-c button.real { border-color: var(--money); }
.desks-c .t { font-family: var(--cond); font-weight: 600; font-size: 1.05rem; display: flex; justify-content: space-between; }
.desks-c .p { font-size: .78rem; color: var(--muted); }
.screens { display: flex; gap: 4px; margin-top: 6px; }
.screens i { flex: 1; height: 14px; border-radius: 2px; border-bottom: 3px solid; }
.sheet { position: fixed; inset: auto 0 0 0; width: auto; max-height: 82vh; overflow-y: auto; z-index: 9; background: #1A1146; border-top: 1px solid var(--edge); padding: 16px 18px 28px; border-radius: 12px 12px 0 0; }
@media (max-width: 1200px) { .legend { display: none; } }
@media (prefers-reduced-motion: reduce) { .desk-tag.ping { animation: none; } .story p.cursor::after { animation: none; } }
</style>

<body>
<header class="bar">
  <span class="brand">Kraken agents</span>
  <nav class="tabs" aria-label="Weergave">
    <a href="index.html" aria-current="page">Handelsvloer</a>
    <a href="radar.html">Radar</a>
    <a href="details.html">Details</a>
  </nav>
  <span class="mode other" id="mode">Laden</span>
  <div class="kpi"><span>Echt geld</span><b class="money" id="eq">–</b></div>
  <div class="kpi"><span>Resultaat</span><b id="ret">–</b></div>
  <div class="kpi"><span>BTC vasthouden</span><b id="bench">–</b></div>
  <div class="kpi"><span>Markt</span><b id="regime">–</b></div>
  <div class="kpi"><span>Volgende run</span><b id="nextrun">–</b></div>
  <div class="kpi"><span>4-uurssluiting</span><b id="next4h">–</b></div>
</header>

<div id="stage" aria-label="De handelsvloer met alle agents"></div>
<div class="loading" id="loading">De handelsvloer wordt ingericht…</div>
<aside class="panel" id="panel" aria-live="polite" hidden></aside>
<div class="legend" id="legend" hidden></div>
<div class="tools" id="tools" hidden><button id="reset">Overzicht</button><span>Slepen om te schuiven, scrollen om te zoomen, rechts slepen om te draaien</span></div>
<div class="caption" id="caption" hidden><div class="now" id="now"></div></div>
<main id="compact" hidden></main>

<script type="module">
import * as THREE from "three";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

/* ============ opmaak en teksten ============ */
const eur = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR" });
const num = (v, d = 2) => new Intl.NumberFormat("nl-NL", { minimumFractionDigits: d, maximumFractionDigits: d }).format(v);
const pct = v => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + num(Math.abs(v), 1) + "%";
const signed = v => (v > 0 ? "+" : v < 0 ? "−" : "") + eur.format(Math.abs(v));
const price = v => v == null ? "–" : v >= 100 ? eur.format(v) : v >= 1 ? "€ " + num(v, 3) : v >= 0.01 ? "€ " + num(v, 5) : "€ " + num(v, 8);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const when = ts => new Date(ts * 1000).toLocaleString("nl-NL", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const clock = ts => new Date(ts * 1000).toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
const base = m => m.split("/")[0];
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

const TEAM = { trend4h: "#7F9BFF", mean_reversion: "#C08CFF", breakout: "#45D1EE", momentum: "#FF9A62", squeeze: "#F4D35E" };
const SIGNAL = { buy: "#5CF2B3", sell: "#FF6B78", hold: "#33405A" };
const ACT = { buy: "kopen", sell: "negatief", hold: "afwachten" };
const TYPES = { entry: "Gekocht", exit: "Verkocht", blocked: "Tegengehouden", validated: "Gevalideerd", note: "Melding" };
const METHOD = {
  trend4h: "Jouw oorspronkelijke bot. Koopt als een 4-uursslot boven het hoogste punt van de vorige 55 candles breekt, met RSI boven 50. Verkoopt via een tweetraps trailing stop: 2 ATR onder de piek, 6 ATR zodra de winst 3 ATR is.",
  mean_reversion: "Koopt paniekdalingen: RSI onder 28 en de koers onder de onderste Bollinger-band, in een munt die op uurbasis stijgt. Verkoopt als de koers terug is bij het gemiddelde, of na 6 uur zonder herstel.",
  breakout: "Koopt als de koers met extra volume door het hoogste punt van de laatste 6 uur breekt, in een stijgende trend. Zijn stop schuift mee omhoog.",
  momentum: "Koopt een versnelling: de MACD kruist omhoog met veel volume, boven het gemiddelde. Verkoopt als de MACD weer omlaag kruist.",
  squeeze: "Wacht tot de markt heel rustig is (smalle Bollinger-banden) en koopt de uitbraak omhoog die daarna komt.",
};
const ROOMS = [
  { key: "data", label: "Data-agent", x: -21, color: "#8FA8E8", role: "Kiest elke run de 15 drukste EUR-munten op Kraken en haalt de koersen op: 15 minuten, 1 uur en 4 uur." },
  { key: "markt", label: "Markt-agent", x: -14, color: "#6FD6B4", role: "Bepaalt of de hele markt stijgt, daalt of zijwaarts gaat, op basis van BTC op uurbasis. In een dalende markt wordt niets gekocht." },
  { key: "prestatie", label: "Prestatie-agent", x: -7, color: "#D49BEA", role: "Meet elke strategie-agent in R en bepaalt zijn invloed. Beslist ook wie met echt geld mag handelen en wie in de schaduw blijft." },
  { key: "beslis", label: "Beslis-agent", x: 0, w: 8, color: "#E9E4FF", role: "Weegt alle koopadviezen: sterkte maal invloed, bonus als agents het eens zijn, maal de marktfase. De beste kansen gaan eerst." },
  { key: "risico", label: "Risico-agent", x: 7, color: "#FF7D88", role: "Bepaalt hoeveel er ingezet wordt en heeft het laatste woord: daglimiet, noodstop, maximaal aantal posities en je budget." },
  { key: "uitvoer", label: "Uitvoer-agent", x: 14, color: "#FFB547", role: "Plaatst de orders op Kraken, zet onder elke positie een stop-loss op Kraken zelf en controleert elke run of alles klopt." },
  { key: "monitor", label: "Monitor-agent", x: 21, color: "#8FC3E8", role: "Schrijft na elke run het verslag in gewone taal en houdt het logboek bij." },
];
const ROOM = Object.fromEntries(ROOMS.map(r => [r.key, r]));

/* ============ data ============ */
let D = null, lastGen = null;
const agentByName = n => D.agents.find(a => a.name === n);
const lastRunEvents = () => D.events.filter(e => e.ts >= D.generated_ts - 20 * 60);
function buyList() {
  const out = [];
  for (const m of D.markets) {
    const e = D.evaluations[m]; if (!e) continue;
    for (const a of D.agents) { const s = e.signals[a.agent]; if (s && s.action === "buy") out.push({ coin: m, agent: a.name, label: a.agent, s }); }
  }
  return out;
}
function roomStatus(key) {
  const live = D.books.live, ev = lastRunEvents(), L = D.risk_limits, r = live ? live.risk || {} : {};
  const buys = buyList(), ent = ev.filter(e => e.type === "entry"), ex = ev.filter(e => e.type === "exit");
  const val = ev.filter(e => e.type === "validated"), bl = ev.filter(e => e.type === "blocked");
  const stops = live ? live.positions.filter(p => p.stop_on_exchange).length : 0;
  const errs = D.errors.filter(e => e.ts === D.generated_ts);
  return {
    data: `${D.markets.length} munten gescand om ${clock(D.generated_ts)}${errs.length ? `, ${errs.length} melding(en)` : ""}`,
    markt: `Markt ${D.regime.label}. ${D.regime.reason}.`,
    prestatie: `${D.agents.filter(a => a.status === "live").length} van ${D.agents.length} agents handelen met echt geld`,
    beslis: buys.length ? `${buys.length} koopadvies${buys.length > 1 ? "en" : ""} op tafel` : "Geen koopadvies deze ronde",
    risico: r.halted ? `Noodstop actief` : ent.length ? `Goedgekeurd: ${ent.map(e => base(e.market)).join(", ")}` : val.length ? `Goedgekeurd (validatie): ${val.map(e => base(e.market)).join(", ")}` : bl.length ? `Tegengehouden: ${bl.map(e => base(e.market)).join(", ")}` : `Verlies vandaag ${num(r.daily_loss_pct || 0, 1)}% van ${L.max_daily_loss_pct}%`,
    uitvoer: ent.length || ex.length ? `${ent.length} gekocht, ${ex.length} verkocht` : `Geen orders, ${stops} stop-loss${stops === 1 ? "" : "es"} op Kraken`,
    monitor: `Verslag bijgewerkt om ${clock(D.generated_ts)}`,
  }[key];
}

async function load() {
  try {
    const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();
    if (d.generated_ts === lastGen) return;
    D = d; lastGen = d.generated_ts;
    header();
    if (COMPACT) buildCompact(); else rebuildFloor();
  } catch (e) {
    if (!D) document.getElementById("loading").textContent = "Nog geen gegevens. Start een run via Actions, Trader, Run workflow.";
  }
}

function header() {
  const live = D.books.live, st = live ? live.stats : null;
  const mode = document.getElementById("mode");
  if (D.mode === "live" && !D.validate_only) { mode.textContent = "Echt geld"; mode.className = "mode live"; }
  else { mode.textContent = D.mode === "live" ? "Validatiemodus" : "Papier"; mode.className = "mode other"; }
  document.getElementById("eq").textContent = st ? eur.format(st.equity) : "–";
  const ret = document.getElementById("ret"); ret.textContent = st ? pct(st.return_pct) : "–";
  ret.className = st && st.return_pct > 0 ? "up" : st && st.return_pct < 0 ? "down" : "";
  document.getElementById("bench").textContent = st ? pct(st.benchmark_return_pct) : "–";
  const rg = document.getElementById("regime"); rg.textContent = D.regime.label;
  rg.className = D.regime.label === "stijgend" ? "up" : D.regime.label === "dalend" ? "down" : "";
}
function tickClocks() {
  const now = Date.now() / 1000, d = new Date(), m = d.getUTCMinutes(), s = d.getUTCSeconds();
  const slots = [3, 18, 33, 48]; const next = slots.find(x => x > m);
  const secs = ((next !== undefined ? next - m : 60 - m + slots[0]) * 60) - s;
  document.getElementById("nextrun").textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;
  const n4 = Math.ceil(now / 14400) * 14400 - now;
  document.getElementById("next4h").textContent = `${Math.floor(n4 / 3600)}:${String(Math.floor((n4 % 3600) / 60)).padStart(2, "0")}`;
}

/* ============ dossiers (wat doet deze agent?) ============ */
const panel = document.getElementById("panel");
let panelMode = "verslag";
function openPanel(html, mode) {
  panelMode = mode;
  if (COMPACT) {
    let sh = document.querySelector(".sheet");
    if (!sh) { sh = document.createElement("div"); sh.className = "sheet panel"; sh.style.position = "fixed"; document.body.appendChild(sh); }
    sh.innerHTML = `<button class="close" aria-label="Sluiten">×</button>` + html;
    sh.querySelector(".close").onclick = () => sh.remove();
    wireLinks(sh);
    return;
  }
  panel.hidden = false;
  panel.innerHTML = (mode === "verslag" ? "" : `<button class="close" aria-label="Sluiten">×</button>`) + html;
  const c = panel.querySelector(".close"); if (c) c.onclick = () => { clearSelection(); showVerslag(); };
  wireLinks(panel);
  panel.scrollTop = 0;
}
function wireLinks(root) {
  root.querySelectorAll("[data-coin]").forEach(b => b.onclick = () => selectCoin(b.dataset.coin));
  root.querySelectorAll("[data-analyst]").forEach(b => { const [a, c] = b.dataset.analyst.split("|"); b.onclick = () => selectAnalyst(a, c); });
  root.querySelectorAll("[data-room]").forEach(b => b.onclick = () => selectRoom(b.dataset.room));
}

function analystHTML(name, coin) {
  const a = agentByName(name), e = D.evaluations[coin], s = e?.signals[a.agent];
  const real = a.status === "live";
  const counts = { buy: [], sell: 0, hold: 0 };
  Object.entries(D.evaluations).forEach(([m, ev]) => { const x = ev.signals[a.agent]; if (!x) return; if (x.action === "buy") counts.buy.push(m); else counts[x.action]++; });
  const pos = [...(D.books.live?.positions || []).map(p => ({ ...p, book: "live" })), ...D.books.schaduw.positions.map(p => ({ ...p, book: "schaduw" }))].filter(p => p.agent === name);
  return `<h3><span class="dot" style="background:${TEAM[name]}"></span>${esc(a.agent)}<span class="chip ${real ? "real" : ""}">${real ? "echt geld" : "schaduw"}</span></h3>
    <p class="sub">Aan het bureau van ${esc(coin)}${e ? `, koers ${price(e.price)}` : ""}</p>
    <div class="doing"><p style="color:var(--muted);font-size:.8rem;margin:0">Wat hij nu doet</p>

  const bg = { buy: "#0E3B2E", sell: "#3D121B", hold: "#151C2C" }[kind], fg = { buy: "#5CF2B3", sell: "#FF6B78", hold: "#5B6E8F" }[kind];

/* --- lopen over de vloer --- */
const nearest = (arr, v) => arr.reduce((a, b) => Math.abs(b - v) < Math.abs(a - v) ? b : a);
function route(a, b) {
  if (Math.abs(a.z - b.z) < 0.01) return [{ x: b.x, z: b.z }];
  const ax = nearest(L.aisles, a.x);
  return [{ x: ax, z: a.z }, { x: ax, z: b.z }, { x: b.x, z: b.z }];
}
const roomDoor = (key, off = 0) => [{ x: ROOM[key].x + off, z: L.corridor }, { x: ROOM[key].x + off, z: L.roomFront + 0.6 }, { x: ROOM[key].x + off, z: L.roomFront - 1.0 }];
class Walker {
  constructor(color, carry, info) {
    this.g = makePerson(color, false, carry); this.g.userData = { ...this.g.userData, ...info }; dyn.add(this.g);
    this.path = []; this.speed = 3.0; this.wait = 0; this.t = Math.random() * 6; hitList.push(this.g); walkers.push(this);
  }
  at(p) { this.g.position.set(p.x, 0, p.z); return this; }
  go(points, done) { this.path.push(...points); if (done) this.path.push({ fn: done }); return this; }
  remove() { dyn.remove(this.g); const i = hitList.indexOf(this.g); if (i >= 0) hitList.splice(i, 1); }
  update(dt) {
    const P = this.g.userData.parts; this.t += dt;
    if (this.wait > 0) { this.wait -= dt; P.legL.rotation.x = P.legR.rotation.x = 0; return; }
    const tgt = this.path[0];
    if (!tgt) { P.legL.rotation.x = P.legR.rotation.x = 0; return; }
    if (tgt.fn) { this.path.shift(); tgt.fn(this); return; }
    if (tgt.wait) { this.path.shift(); this.wait = tgt.wait; if (tgt.then) tgt.then(this); return; }
    const pos = this.g.position, dx = tgt.x - pos.x, dz = tgt.z - pos.z, dist = Math.hypot(dx, dz);
    const step = this.speed * dt;
    if (dist <= step) { pos.x = tgt.x; pos.z = tgt.z; this.path.shift(); }
    else { pos.x += dx / dist * step; pos.z += dz / dist * step; this.g.rotation.y = Math.atan2(-dx, -dz); }
    const sw = Math.sin(this.t * 11) * 0.55;
    P.legL.rotation.x = sw; P.legR.rotation.x = -sw;
    P.body.position.y = 1.25 + Math.abs(Math.sin(this.t * 11)) * 0.04;
  }
}

/* --- de cyclus: wat er op de vloer gebeurt --- */
const CYCLE = 30;
let events = [], cycleNo = 0, phaseName = "", typingBoost = 1;
function at(t, fn) { events.push({ t, fn }); events.sort((a, b) => a.t - b.t); }
function caption(phase, text) { phaseName = phase; document.getElementById("now").innerHTML = `<b>${phase}</b>${esc(text)}`; }
function startCycle() {
  clockT = 0; cycleNo++;
  // vaste rondes: twee datakoeriers en de prestatie-agent
  const courier = (offset) => {
    const w = new Walker(ROOM.data.color, "#7FD7FF", { pick: "room", key: "data" });
    w.at({ x: ROOM.data.x + offset, z: L.roomFront - 1.0 });
    const loop = () => {
      const desks = Object.entries(deskRefs).filter((_, i) => i % 2 === (offset > 0 ? 1 : 0));
      let cur = { x: ROOM.data.x + offset, z: L.corridor };
      const pts = [{ x: ROOM.data.x + offset, z: L.roomFront + 0.6 }, cur];
      desks.forEach(([m, d]) => { const tgt = { x: d.dx + (offset > 0 ? 1.2 : -1.2), z: rowAisle(d.dz) }; pts.push(...route(cur, tgt), { wait: 0.5, then: () => ping(m) }); cur = tgt; });
      pts.push(...route(cur, { x: ROOM.data.x + offset, z: L.corridor }), { x: ROOM.data.x + offset, z: L.roomFront - 1.0 }, { wait: 2 });
      w.go(pts, loop);
    };
    loop();
  };
  if (!REDUCED) { courier(-0.8); courier(0.8); }
  if (!REDUCED) {
    const p = new Walker(ROOM.prestatie.color, "#FFFFFF", { pick: "room", key: "prestatie" });
    p.speed = 2.0; p.at({ x: ROOM.prestatie.x, z: L.roomFront - 1.0 });
    const loop = () => {
      const pick = analysts.filter(() => Math.random() < 0.06).slice(0, 4);
      let cur = { x: ROOM.prestatie.x, z: L.corridor };
      const pts = [{ x: ROOM.prestatie.x, z: L.roomFront + 0.6 }, cur];
      pick.forEach(a => { const tgt = { x: a.seat.x, z: a.aisleZ - 0.6 }; pts.push(...route(cur, { x: a.seat.x, z: a.aisleZ }), tgt, { wait: 1.6 }, { x: a.seat.x, z: a.aisleZ }); cur = { x: a.seat.x, z: a.aisleZ }; });
      pts.push(...route(cur, { x: ROOM.prestatie.x, z: L.corridor }), { x: ROOM.prestatie.x, z: L.roomFront - 1.0 }, { wait: 4 });

}
function scheduleCycle(t0) {

  const ent = ev.filter(e => e.type === "entry"), ex = ev.filter(e => e.type === "exit"), val = ev.filter(e => e.type === "validated"), bl = ev.filter(e => e.type === "blocked");

  at(t0 + 5, () => { caption("Analyseren", `${D.agents.length} teams beoordelen elke munt: ${buys.length}× kopen`); typingBoost = 3.2; setBubble("data", roomStatus("data"), false); setBubble("markt", `Markt ${D.regime.label}`, true); });
  at(t0 + 10, () => {
    typingBoost = 1; setBubble("markt", roomStatus("markt"), false);
    if (!buys.length) { caption("Beslissen", "Geen enkele agent wil kopen; de Beslis-agent heeft niets op tafel"); setBubble("beslis", "Geen koopadvies deze ronde", true); return; }
    caption("Beslissen", `${buys.length} analist${buys.length > 1 ? "en brengen" : " brengt"} een koopadvies naar de Beslis-agent`);
    setBubble("beslis", "Wacht op de adviezen…", true);
    buys.forEach((b, i) => {
      const an = analysts.find(a => a.agent === b.agent && a.coin === b.coin); if (!an || an.busy || REDUCED) return;
      an.busy = true; an.person.visible = false; if (an.marker) an.marker.visible = false;
      const w = new Walker(TEAM[b.agent], "#5CF2B3", { pick: "analyst", agent: b.agent, coin: b.coin });
      w.at(an.seat); w.speed = 3.4;
      const off = (i - (buys.length - 1) / 2) * 0.8, aisle = { x: an.seat.x, z: an.aisleZ };
      const there = [aisle, ...route(aisle, { x: ROOM.beslis.x + off, z: L.corridor }), ...roomDoor("beslis", off).slice(1)];
      w.go([...there, { wait: 1.4, then: () => { setBubble("beslis", `Ontvangen: ${b.label} op ${base(b.coin)}, sterkte ${num(b.s.strength, 2)}`, true); w.g.userData.parts.carry.visible = false; } }]);
      w.go([...there.slice().reverse().slice(1), aisle, an.seat], () => { w.remove(); walkers.splice(walkers.indexOf(w), 1); an.person.visible = true; an.busy = false; if (an.marker) an.marker.visible = true; });
    });

    setBubble("beslis", roomStatus("beslis"), false); setBubble("risico", roomStatus("risico"), true);
  });
  at(t0 + 21, () => {
    setBubble("risico", roomStatus("risico"), false);
    if (!orders.length) { const n = D.books.live ? D.books.live.positions.filter(p => p.stop_on_exchange).length : 0; caption("Uitvoeren", `Geen orders deze run. ${n} stop-loss${n === 1 ? "" : "es"} op Kraken bewaakt`); setBubble("uitvoer", roomStatus("uitvoer"), true); return; }
    const live = orders.some(o => o.book === "live");
    caption("Uitvoeren", `Uitvoer-agent brengt ${orders.map(o => (o.type === "exit" ? "verkoop " : "koop ") + base(o.market) + (o.book === "live" ? " (echt geld)" : " (schaduw)")).join(", ")} naar Kraken`);
    setBubble("uitvoer", "Onderweg naar Kraken", true);
    if (REDUCED) return;
    const w = new Walker(ROOM.uitvoer.color, live ? "#FFB547" : "#B9AEFF", { pick: "room", key: "uitvoer" });
    w.speed = 5.2; w.at({ x: ROOM.uitvoer.x, z: L.roomFront - 1.0 });
    const there = [{ x: ROOM.uitvoer.x, z: L.roomFront + 0.6 }, { x: ROOM.uitvoer.x, z: L.corridor }, { x: L.aisles[0], z: L.corridor }, { x: L.aisles[0], z: L.gate.z }, { x: -26.4, z: L.gate.z }];
    w.go([...there, { wait: 0.9, then: () => { gatePulse = 1.6; w.g.userData.parts.carry.visible = false; setBubble("uitvoer", roomStatus("uitvoer"), true); } }]);
    w.go(there.slice().reverse().slice(1).concat([{ x: ROOM.uitvoer.x, z: L.roomFront - 1.0 }]), () => { w.remove(); walkers.splice(walkers.indexOf(w), 1); });
  });
  at(t0 + 27, () => { caption("Rapporteren", "Monitor-agent zet het verslag en het saldo op het grote scherm"); setBubble("uitvoer", roomStatus("uitvoer"), false); setBubble("monitor", "Verslag bijgewerkt", true); drawBigScreen(true); setTimeout(() => drawBigScreen(false), 700); });
  at(t0 + CYCLE, () => { setBubble("monitor", roomStatus("monitor"), false); scheduleCycle(t0 + CYCLE); });
}
function ping(m) { const t = deskRefs[m]?.tag.element; if (!t) return; t.classList.remove("ping"); void t.offsetWidth; t.classList.add("ping"); }
let gatePulse = 0;

/* --- elke frame --- */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  update(dt); draw();
}
function draw() {
  const t = controls.target; t.x = Math.max(-26, Math.min(26, t.x)); t.z = Math.max(-20, Math.min(14, t.z));
  controls.update();
  renderer.render(scene, camera); labels.render(scene, camera);
}
function update(dt) {
  clockT += dt;
  while (events.length && events[0].t <= clockT) events.shift().fn();
  if (!REDUCED) {
    for (const a of analysts) {
      if (a.busy) continue;
      const P = a.person.userData.parts, sp = 9 * typingBoost * (a.act === "buy" ? 1.4 : 1);
      P.armL.rotation.x = -0.55 + Math.sin(clockT * sp + a.phase) * 0.13;
      P.armR.rotation.x = -0.55 + Math.sin(clockT * sp + a.phase + 2.2) * 0.13;
      P.head.position.y = 1.84 + Math.sin(clockT * 1.7 + a.phase) * 0.02;
      P.hair.position.y = P.head.position.y + 0.03;
      a.person.rotation.y = Math.sin(clockT * 0.4 + a.phase) * 0.08;
    }
    for (const k of ["buy", "sell", "hold"]) shared.tex[k].offset.x = (shared.tex[k].offset.x + dt * (k === "hold" ? 0.03 : 0.12) * typingBoost) % 1;
    shared.tickerTex.offset.x = (shared.tickerTex.offset.x + dt * 0.012) % 1;
    for (const w of walkers) w.update(dt);
    Object.values(roomRefs).forEach((r, i) => { const P = r.person.userData.parts; P.armL.rotation.x = -0.55 + Math.sin(clockT * 7 + i) * 0.1; P.armR.rotation.x = -0.55 + Math.sin(clockT * 7 + i + 2) * 0.1; });
    gatePulse = Math.max(0, gatePulse - dt);
    gateRing.scale.setScalar(1 + gatePulse * 0.12); gateDisc.material.color.set(gatePulse > 0 ? "#FFB547" : "#4B2E7E");
    gateDisc.material.opacity = 0.75 + Math.sin(clockT * 2) * 0.15;
    if (selMarker) selMarker.rotation.z += dt * 1.5;
  }
}

/* --- aanklikken --- */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null, selection = null, selMarker = null;
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(hitList, true);
  for (const h of hits) {
    let o = h.object;
    if (o.isInstancedMesh) {
      if (o === shared.deskTopIM) return { kind: "coin", coin: Object.keys(deskRefs)[h.instanceId] };
      const s = screenRecs.find(x => x.im === o && x.i === h.instanceId); if (s) return { kind: "analyst", agent: s.agent, coin: s.coin };
      continue;
    }
    while (o && !o.userData.pick) o = o.parent;
    if (!o) continue;
    if (o.userData.pick === "analyst") return { kind: "analyst", agent: o.userData.agent, coin: o.userData.coin };
    if (o.userData.pick === "room") return { kind: "room", key: o.userData.key };
  }
  return null;
}
function setupPicking() {
  const cv = renderer.domElement;
  cv.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY }; });
  cv.addEventListener("pointerup", e => {
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6 || e.button !== 0) return;
    const p = pick(e);
    if (!p) return;
    if (p.kind === "analyst") selectAnalyst(p.agent, p.coin);
    if (p.kind === "coin") selectCoin(p.coin);
    if (p.kind === "room") selectRoom(p.key);
  });
  let lastMove = 0;
  cv.addEventListener("pointermove", e => { if (performance.now() - lastMove < 80 || e.buttons) return; lastMove = performance.now(); cv.style.cursor = pick(e) ? "pointer" : "grab"; });
  addEventListener("keydown", e => { if (e.key === "Escape") { clearSelection(); showVerslag(); } });
}
function mark(x, z, r = 0.9, color = "#FFB547") {
  if (selMarker) scene.remove(selMarker);
  selMarker = new THREE.Mesh(new THREE.RingGeometry(r * 0.82, r, 40, 1, 0, Math.PI * 1.6), new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide }));
  selMarker.rotation.x = -Math.PI / 2; selMarker.position.set(x, 0.08, z); scene.add(selMarker);
}
function clearSelection() { selection = null; if (selMarker) { scene.remove(selMarker); selMarker = null; } }
function selectAnalyst(agent, coin) {
  if (COMPACT) return openPanel(analystHTML(agent, coin), "analyst");
  selection = { kind: "analyst", agent, coin };
  const a = analysts.find(x => x.agent === agent && x.coin === coin); if (a) mark(a.seat.x, a.seat.z, 0.75);
  openPanel(analystHTML(agent, coin), "analyst");
}
function selectCoin(coin) {
  if (COMPACT) return openPanel(coinHTML(coin), "coin");
  selection = { kind: "coin", coin };
  const d = deskRefs[coin]; if (d) mark(d.dx, d.dz + 0.6, 4.2);
  openPanel(coinHTML(coin), "coin");
}
function selectRoom(key) {
  if (COMPACT) return openPanel(roomHTML(key), "room");
  selection = { kind: "room", key };
  mark(ROOM[key].x, L.roomZ, (ROOM[key].w || 6) / 2 + 0.3);
  openPanel(roomHTML(key), "room");
}
function reselect() { const s = selection; if (!s) return; if (s.kind === "analyst") selectAnalyst(s.agent, s.coin); if (s.kind === "coin") selectCoin(s.coin); if (s.kind === "room") selectRoom(s.key); }
window.selectCoin = selectCoin;

/* ============ start ============ */
setInterval(tickClocks, 1000); tickClocks();
if (COMPACT) { document.body.classList.remove("floor"); document.getElementById("loading").hidden = true; }
load();
setInterval(load, 60 * 1000);
document.fonts?.ready.then(() => { if (D && !COMPACT && shared.screenCanvas) { drawBigScreen(); drawTicker(); } });
window.__floor = { step: sec => { for (let i = 0; i < sec / 0.05; i++) update(0.05); draw(); }, pick: (x, y) => pick({ clientX: x, clientY: y }), analysts: () => analysts, project: (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(camera); return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight }; } };
</script>
</body>
